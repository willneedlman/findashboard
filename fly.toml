app = "finance-terminal"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  PYTHONPATH = "/app/backend"
  SENTIMENT_HISTORY_PATH = "/data/sentiment_history.json"
  # Persist the API cache on the volume so deploys/restarts don't re-burn the
  # FMP daily quota. Default is the ephemeral container FS (lost every deploy).
  DISK_CACHE_PATH = "/data/disk_cache.db"
  # Persist the user/auth database on the volume too — otherwise every deploy
  # recreates an empty users.db and wipes all accounts.
  USERS_DB_PATH = "/data/users.db"
  # Persist the MM-simulator leaderboard on the volume so global top returns
  # survive deploys/restarts.
  LEADERBOARD_DB_PATH = "/data/leaderboard.db"
  # Email an alert (to ADMIN_ALERT_EMAIL) on unhandled server errors so crashes
  # aren't silent. Off by default in dev; on in prod.
  ERROR_ALERTS = "1"
  # From-address for transactional mail (password reset + error alerts). Sent via
  # Resend; the RESEND_API_KEY secret must be set and alphatape.app verified in
  # Resend (SPF/DKIM) for delivery. Without the secret, mail falls back to console.
  EMAIL_FROM = "Alphatape Terminal <no-reply@alphatape.app>"
  ENABLE_BACKGROUND_WARMERS = "0"
  ENABLE_LIVE_MARITIME = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 48
    soft_limit = 32

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  # 512mb OOM-killed uvicorn at ~398MB RSS once the AIS replay buffer and
  # rates warmer landed (2026-07-02 incident). Baseline needs the headroom.
  #
  # 1024mb then OOM-killed it again on 2026-08-18, mid-request, during
  # /api/strategy/generate. The proxy reported "could not find a good candidate
  # within 40 attempts at load balancing" and the browser showed a bare
  # "Request failed", because the process died rather than answering. Measured
  # on the box just after that restart: 962MB usable, uvicorn already at 301MB
  # idle, so roughly a third was gone before any request ran and one heavy
  # endpoint could clear the rest. The baseline has not fallen since the last
  # incident and the caches grow between restarts, so buy the headroom.
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source      = "ft_data"
  destination = "/data"
