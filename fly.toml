app = "finance-terminal"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  PYTHONPATH = "/app/backend"
  SENTIMENT_HISTORY_PATH = "/data/sentiment_history.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source      = "ft_data"
  destination = "/data"
